<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" style="background:#0e111a; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d2c"/>
      <stop offset="100%" stop-color="#0c0e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(229,215,163,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Card Frame -->
  <rect width="598" height="378" x="1" y="1" rx="12" fill="url(#g1)" stroke="rgba(229,215,163,0.3)" stroke-width="1.5"/>
  <rect width="598" height="378" x="1" y="1" rx="12" fill="url(#glow)"/>

  <!-- Top Badge -->
  <rect x="24" y="24" width="160" height="26" rx="13" fill="#1f2538" stroke="rgba(229,215,163,0.4)" stroke-width="1"/>
  <circle cx="38" cy="37" r="4" fill="#e5d7a3"/>
  <text x="50" y="41" fill="#e5d7a3" font-size="11" font-weight="700" letter-spacing="0.05em">FIELD DEMO 01</text>

  <!-- Center Graphic: Laptop in BIOS + Phone -->
  <!-- Laptop Screen -->
  <rect x="130" y="75" width="340" height="190" rx="8" fill="#000" stroke="#333f5c" stroke-width="2"/>
  <rect x="142" y="87" width="316" height="166" rx="4" fill="#000080"/> <!-- Classic BIOS Blue -->
  <text x="155" y="108" fill="#ffffff" font-size="11" font-weight="700" font-family="monospace">PhoenixBIOS Setup Utility</text>
  <line x1="142" y1="116" x2="458" y2="116" stroke="#ffffff" stroke-width="0.8"/>
  <text x="155" y="136" fill="#ffff00" font-size="10" font-family="monospace">&gt; Boot Priority Order</text>
  <text x="175" y="152" fill="#ffffff" font-size="9.5" font-family="monospace">1: USB HDD: Kingston DT</text>
  <text x="175" y="168" fill="#ffffff" font-size="9.5" font-family="monospace">2: IDE 0: NVMe SSD 1TB</text>
  <text x="155" y="192" fill="#86efac" font-size="9" font-family="monospace">[Item Specific Help: Use ↑ ↓ to select]</text>
  <text x="155" y="210" fill="#e5d7a3" font-size="9" font-family="monospace">Dell USB Keyboard (0x413c:0x2113) ACTIVE</text>
  <text x="155" y="226" fill="#00e5ff" font-size="8.5" font-family="monospace">Zero host drivers &#8226; Operating at boot</text>

  <!-- Laptop Base -->
  <path d="M 100 265 L 500 265 L 520 280 L 80 280 Z" fill="#1a2030" stroke="#333f5c" stroke-width="1.5"/>

  <!-- Play Overlay Badge -->
  <circle cx="300" cy="170" r="32" fill="rgba(229,215,163,0.92)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))"/>
  <polygon points="292,154 316,170 292,186" fill="#0e111a"/>

  <!-- Title & Subtitle at Bottom -->
  <text x="300" y="322" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Pre-Boot BIOS &amp; Recovery Proof</text>
  <text x="300" y="344" fill="#8fa1bd" font-size="12" text-anchor="middle">Navigates motherboard setup without OS or network drivers &#8226; Drop demo-bios.gif here</text>
</svg>
